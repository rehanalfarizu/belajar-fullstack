# ============================================================
# SOAL 04 — docker-compose.yml untuk aplikasi fullstack (kerangka)
# ============================================================
# Gabungkan frontend, backend, dan PostgreSQL (opsional: Nginx, Redis) dalam
# satu file Compose. Kunci `version:` tidak dipakai di Compose v2.
#
# Perintah (dari folder file ini; sesuaikan path):
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f backend
#   docker compose down        # data tetap ada (volume)
#   docker compose down -v     # hapus volume juga (bersih total)
#
# Kunci jawaban: ../solusi-jangan-dibuka-dulu.md (jangan dibuka dulu).
# ============================================================

