      padding: 1.5rem;
      line-height: 1.6;
      color: #1f2937;
    }
    /* Layout 2 kolom: main (produk) + aside (keranjang) */
    main { display: grid; grid-template-columns: 3fr 1fr; gap: 2rem; margin-top: 1.5rem; }
    article { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 1rem; }
    article img { max-width: 100%; height: auto; border-radius: 4px; }
    aside { background: #f9fafb; padding: 1rem; border-radius: 6px; }
