<!--
  TEMPLATE CODE — Standar Repositori Belajar-Fullstack
  =====================================================
  File ini adalah TEMPLATE untuk `code/[nomor]-[slug].html` di setiap soal.
  Copy file ini, ganti placeholder {...} dengan konten spesifik soal.

  Prinsip-prinsip template ini:
  1. Boilerplate LENGKAP (DOCTYPE, html, head, body) — tidak ada yang perlu ditambah
  2. CSS minimal sudah disertakan — supaya output rapi TANPA kerja CSS
  3. TODO(human) sections eksplisit, satu per blok, dengan instruksi jelas
  4. Tidak ada duplikat antara kode jadi dan TODO (hanya salah satu)
  5. Heading/comments menjelaskan TUJUAN setiap section, bukan cuma "letakkan di sini"

  Lihat juga: TEMPLATE-soal.md dan TEMPLATE-contoh.html.
-->

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{Judul Halaman}</title>
  <meta name="description" content="{Deskripsi meta}">

  <style>
    /* ============================================
       CSS MINIMAL — agar expected output tercapai
       ============================================
       CSS ini BUKAN untuk latihan CSS.
       Fungsinya hanya supaya layout tidak "amburadul"
       di browser. Kalau kamu sudah masuk LEVEL 2,
       hapus <style> ini dan tulis ulang pakai CSS proper.
       ============================================ */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      line-height: 1.6;
      color: #1f2937;
    }
    h1, h2, h3 { color: #111827; }
    fieldset {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    legend { padding: 0 0.5rem; font-weight: 600; }
    form > div, form > p { margin-bottom: 0.75rem; }
    label { display: inline-block; min-width: 140px; }
    input, select, textarea {
      padding: 0.4rem 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 1rem;
    }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d1d5db; padding: 0.5rem 0.75rem; text-align: left; }
    thead { background: #f3f4f6; }
    /* Tambah CSS spesifik soal di bawah sini */
  </style>
</head>
<body>

  <!-- ============================================
       BAGIAN 1: HEADER / JUDUL HALAMAN
       ============================================ -->
  <header>
    <h1>{Judul Utama H1}</h1>
    <p>{Tagline atau deskripsi singkat}</p>
  </header>

  <main>

    <!-- ============================================
         BAGIAN 2: {NAMA SECTION 1}
         ============================================ -->
    <section>
      <h2>{Judul Section H2}</h2>

      <!-- TODO(human): Tambahkan {elemen yang diminta}
           Panduan: {instruksi singkat 1 kalimat}
           Lihat soal/[nomor].md untuk detail lengkap. -->
      <p>Konten section ini perlu kamu isi.</p>
    </section>

    <!-- ============================================
         BAGIAN 3: {NAMA SECTION 2}
         ============================================ -->
    <section>
      <h2>{Judul Section H2}</h2>

      <!-- TODO(human): {elemen} dengan {kriteria}
           Contoh pola:
             <element atribut="value">konten</element>
           Jangan lupa: {pengingat atribut penting} -->

    </section>

    <!-- Tambah section lain sesuai kebutuhan soal -->

  </main>

  <!-- ============================================
       FOOTER
       ============================================ -->

    <p>&copy; 2026 — {Kredit author atau link kembali}</p>

</body>
</html>
